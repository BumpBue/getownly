## getownly - Docker services.
##
## Two ways to run, on purpose:
##
##   pnpm docker:up                    infrastructure only (postgres, minio,
##                                     mailhog) with the app on the host. This
##                                     is the day-to-day loop: hot reload, no
##                                     rebuild between edits.
##
##   docker compose --profile full up  the whole system in containers,
##                                     including the API and the web app
##                                     (ทก.01 ข้อ 2.7.4). Slower to start,
##                                     but one command on a clean machine.
##
## The `full` profile only adds containers; it changes nothing about the three
## below, so the two modes cannot interfere with each other.
##
##   pnpm docker:down    stop, keep data
##   pnpm docker:reset   stop, DELETE all data, start fresh

name: getownly

services:
  postgres:
    image: postgres:16-alpine
    container_name: getownly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: getownly
      POSTGRES_PASSWORD: getownly_dev_password
      POSTGRES_DB: getownly
      # Thai collation-safe defaults; ordering is done in the app layer.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Host port 5433 on purpose: a locally installed PostgreSQL commonly
      # occupies 5432 and would silently shadow this container.
      # If nothing else uses 5432 on your machine you may change this to
      # '5432:5432' and update DATABASE_URL in backend/.env to match.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U getownly -d getownly']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: getownly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: getownly
      MINIO_ROOT_PASSWORD: getownly_dev_password
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container: creates the media bucket, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: getownly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 getownly getownly_dev_password &&
      mc mb --ignore-existing local/getownly-media &&
      mc anonymous set none local/getownly-media &&
      echo 'bucket getownly-media is ready';
      "

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: getownly-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI - http://localhost:8025
    logging:
      driver: none

  # --- the application itself, only under `--profile full` -----------------

  # One-shot container: creates the database the `full` profile uses, then
  # exits. Same shape as minio-init above.
  #
  # This exists so the containerised stack has a database of its own. Pointing
  # it at `getownly` would mean `docker compose --profile full up` silently
  # rebuilding and re-seeding the development database — a destructive act
  # nobody asked for, reached by a command that reads like "start the app".
  db-init:
    profiles: ['full']
    image: postgres:16-alpine
    container_name: getownly-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: getownly_dev_password
      TARGET_DB: ${GETOWNLY_DOCKER_DB:-getownly_docker}
    entrypoint: >
      /bin/sh -c "
      if [ \"$$TARGET_DB\" = 'getownly' ]; then
        echo 'ปฏิเสธ: GETOWNLY_DOCKER_DB ตั้งเป็น getownly ซึ่งเป็นฐานข้อมูลสำหรับพัฒนา' >&2;
        echo 'REFUSED: the full profile must not target the development database' >&2;
        exit 1;
      fi;
      psql -h postgres -U getownly -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname='$$TARGET_DB'\" | grep -q 1 ||
      psql -h postgres -U getownly -d postgres -c \"CREATE DATABASE \\\"$$TARGET_DB\\\"\";
      echo \"database $$TARGET_DB is ready\";
      "

  api:
    profiles: ['full']
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: getownly-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      # Inside the compose network the database is `postgres:5432`, not the
      # host's published 5433.
      #
      # And it is `getownly_docker`, not `getownly`: this profile runs
      # migrations on start and the README tells you to seed it, both of which
      # wipe what they touch. The development database is reached only by
      # commands run deliberately on the host, never as a side effect of
      # starting containers. Override with GETOWNLY_DOCKER_DB if you need a
      # different one — db-init refuses `getownly`.
      DATABASE_URL: postgresql://getownly:getownly_dev_password@postgres:5432/${GETOWNLY_DOCKER_DB:-getownly_docker}?schema=public
      JWT_ACCESS_SECRET: docker_demo_access_secret_change_me_before_production
      JWT_REFRESH_SECRET: docker_demo_refresh_secret_change_me_before_production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
      BCRYPT_COST: '12'
      PASSWORD_RESET_EXPIRES_MINUTES: '60'
      RATE_LIMIT_LOGIN_LIMIT: '5'
      RATE_LIMIT_LOGIN_TTL_SECONDS: '60'
      RATE_LIMIT_FORGOT_PASSWORD_LIMIT: '3'
      RATE_LIMIT_FORGOT_PASSWORD_TTL_SECONDS: '3600'
      # The browser talks to the web app on localhost:3000, so that is the
      # origin the API must accept cookies from.
      FRONTEND_ORIGIN: http://localhost:3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      # The browser cannot resolve `minio`, so presigned URLs are signed for
      # the address it can reach: the port this compose file publishes.
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: '9000'
      MINIO_PUBLIC_USE_SSL: 'false'
      MINIO_ACCESS_KEY: getownly
      MINIO_SECRET_KEY: getownly_dev_password
      MINIO_BUCKET: getownly-media
      MINIO_PRESIGN_EXPIRY_SECONDS: '3600'
      MINIO_PRESIGN_UPLOAD_EXPIRY_SECONDS: '900'
      MAIL_HOST: mailhog
      MAIL_PORT: '1025'
      MAIL_SECURE: 'false'
      MAIL_FROM_NAME: getownly
      MAIL_FROM_ADDRESS: no-reply@getownly.local
      PLATFORM_DEFAULT_COMMISSION_RATE: '0.30'
      # Zeroes on purpose. See the warning in backend/.env.example.
      PROMPTPAY_ID: '0000000000'
      PROMPTPAY_DISPLAY_NAME: GETOWNLY PLATFORM (สาธิต)
      DEMO_MODE: 'true'
      TOPUP_MIN_AMOUNT: '20'
      TOPUP_MAX_AMOUNT: '50000'
      TOPUP_QUOTE_EXPIRY_MINUTES: '15'
    ports:
      - '4000:4000'

  web:
    profiles: ['full']
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Read by the browser, so they are baked in at build time and must be
        # the addresses a person's browser can reach — not container names.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: getownly-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server Components call the API from inside the network, where it is
      # `api:4000`. The browser still uses localhost, from the build arg above.
      API_BASE_URL: http://api:4000/api
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  minio-data:
